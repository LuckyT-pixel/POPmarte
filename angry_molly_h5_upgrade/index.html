<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Angry Molly 活人感测试</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Arial Rounded MT Bold",sans-serif;
  background:#dfe3ff;color:#403070;
}
button{font:inherit}
.app{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:linear-gradient(180deg,#e8e2ff 0%,#dff4ff 100%);
}
.page{
  position:absolute;inset:0;display:none;z-index:2;overflow:hidden;
}
.page.active{display:block;animation:pageIn .45s ease both}
@keyframes pageIn{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:none}}

.cover-fit,.poster-fit{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;background:#dfe3ff;
}
.float-layer{position:absolute;inset:0;pointer-events:none;z-index:3}
.cloud,.star,.bubble{
  position:absolute;opacity:.8;filter:drop-shadow(0 4px 8px rgba(103,88,170,.12));
  animation:floatUp linear infinite;
}
.cloud{
  width:88px;height:36px;border-radius:999px;background:rgba(255,255,255,.82);
}
.cloud:before,.cloud:after{
  content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.86)
}
.cloud:before{width:42px;height:42px;left:12px;top:-20px}
.cloud:after{width:52px;height:52px;right:10px;top:-28px}
.star{font-size:25px;color:#fff1a8;text-shadow:0 0 10px rgba(255,215,116,.8)}
.bubble{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
@keyframes floatUp{
  0%{transform:translateY(28px) scale(.9);opacity:0}
  12%{opacity:.88}
  100%{transform:translateY(-110vh) scale(1.08);opacity:0}
}

.start-panel{
  position:absolute;left:18px;right:18px;bottom:22px;z-index:5;
  padding:16px 16px 18px;border-radius:28px;
  background:rgba(255,255,255,.76);
  border:2px solid rgba(126,100,190,.16);
  box-shadow:0 16px 42px rgba(90,80,170,.24);
  backdrop-filter:blur(12px);
  text-align:center;
}
.brand{font-size:12px;font-weight:900;letter-spacing:2px;color:#7a61c7;margin-bottom:4px}
.start-title{margin:0;color:#7054bd;font-size:29px;line-height:1.12;font-weight:950;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.start-sub{margin:10px 0 14px;color:#5e5795;font-size:14px;line-height:1.58;font-weight:700}
.btn{
  width:100%;height:52px;border:0;border-radius:999px;
  color:#fff;font-size:16px;font-weight:950;
  background:linear-gradient(135deg,#8060d8 0%,#ff9ac8 100%);
  box-shadow:0 10px 24px rgba(128,96,216,.32);
}
.btn:active{transform:scale(.97)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-2px);box-shadow:0 14px 30px rgba(255,154,200,.4)}}

.quiz-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.38;background:#dfe3ff}
.quiz-wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(224,229,255,.74))}
.molly-mini{
  position:absolute;left:50%;top:18px;z-index:4;
  transform:translateX(-50%);
  width:105px;height:105px;border-radius:50%;
  background:rgba(255,255,255,.74);
  border:2px solid rgba(126,100,190,.16);
  box-shadow:0 10px 25px rgba(90,80,170,.18);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.face{
  width:68px;height:68px;border-radius:50%;background:#ffd8df;position:relative;
  box-shadow:0 0 0 8px #e9defd;
}
.face:before,.face:after{
  content:"";position:absolute;width:12px;height:6px;background:#342657;top:28px;border-radius:8px
}
.face:before{left:17px;transform:rotate(18deg)}
.face:after{right:17px;transform:rotate(-18deg)}
.face i{position:absolute;left:26px;top:43px;width:18px;height:8px;border-bottom:4px solid #342657;border-radius:50%}
.face.blink:before,.face.blink:after{height:3px;top:31px}

.quiz-card{
  position:absolute;left:16px;right:16px;bottom:16px;z-index:5;
  padding:18px 14px;border-radius:30px;
  background:rgba(255,255,255,.84);
  border:2px solid rgba(126,100,190,.15);
  box-shadow:0 16px 42px rgba(77,63,150,.22);
  backdrop-filter:blur(12px);
}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:13px}
.progress{flex:1;height:9px;background:rgba(126,100,190,.14);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ac8,#8060d8);border-radius:999px;transition:.32s}
.count{font-size:13px;font-weight:950;color:#8060d8}
.question{
  white-space:pre-line;margin:0 0 15px;color:#3c3174;
  font-size:21px;line-height:1.35;font-weight:950;
}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.option{
  position:relative;min-height:108px;border:0;border-radius:24px;padding:10px 8px;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(244,239,255,.9));
  box-shadow:inset 0 0 0 2px rgba(128,96,216,.1),0 9px 18px rgba(83,73,160,.13);
  text-align:center;color:#3c3174;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
.option:after{content:"";position:absolute;inset:auto -20px -45px;height:70px;background:radial-gradient(circle,rgba(255,154,200,.22),transparent 65%)}
.option:active{transform:scale(.94) rotate(-1deg);box-shadow:inset 0 0 0 2px #ff8fbd,0 9px 18px rgba(83,73,160,.13)}
.icon{width:44px;height:44px;margin-bottom:7px;position:relative;z-index:1}
.icon.heart{background:#ff8fb8;border-radius:50% 50% 45% 45%;transform:rotate(-45deg);box-shadow:0 0 16px rgba(255,143,184,.5)}
.icon.heart:before,.icon.heart:after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#ff8fb8}
.icon.heart:before{left:22px;top:0}.icon.heart:after{left:0;top:-22px}
.icon.cloud{width:50px;height:30px;margin-top:8px;background:#dff3ff;border-radius:22px;box-shadow:16px 5px 0 #dff3ff,-12px 7px 0 #dff3ff}
.icon.star:before{content:"★";font-size:44px;color:#ffd166;text-shadow:0 0 12px rgba(255,209,102,.7);position:absolute;left:0;top:-6px}
.icon.fire{border-radius:50% 50% 50% 0;background:linear-gradient(135deg,#ff5c68,#ffd166);transform:rotate(-45deg);box-shadow:0 0 17px rgba(255,92,104,.45)}
.option b{font-size:13px;color:#8060d8;margin-bottom:4px;z-index:1}
.option span{font-size:13.5px;line-height:1.35;font-weight:700;z-index:1}

.loading{z-index:9;background:linear-gradient(180deg,#efe8ff,#dff4ff);display:none;align-items:center;justify-content:center;text-align:center}
.loading.active{display:flex;flex-direction:column}
.loader-fire{
  width:78px;height:78px;border-radius:50% 50% 50% 0;
  background:linear-gradient(135deg,#ff5c68,#ffd166);
  transform:rotate(-45deg);box-shadow:0 0 28px rgba(255,92,104,.45);
  animation:flame .7s infinite alternate ease-in-out;
}
@keyframes flame{to{transform:rotate(-45deg) scale(1.08) translateY(-5px)}}
.loading p{font-weight:950;color:#7054bd;margin-top:24px;letter-spacing:1px}

.result{background:#dfe3ff}
.poster-fit{z-index:1}
.result-text{
  position:absolute;left:16px;right:16px;bottom:84px;z-index:3;
  padding:14px 16px;border-radius:24px;text-align:center;
  background:rgba(255,255,255,.78);
  border:2px solid rgba(126,100,190,.13);
  box-shadow:0 12px 32px rgba(77,61,140,.18);
  backdrop-filter:blur(10px);
}
.result-name{margin:0;font-size:26px;font-weight:950}
.percent{font-size:16px;font-weight:950;margin:5px 0 7px}
.copy{font-size:15px;line-height:1.55;font-weight:800;color:#443a79}
.result.red .result-name,.result.red .percent{color:#d92d3a}
.result.love .result-name,.result.love .percent{color:#e85c96}
.result.green .result-name,.result.green .percent{color:#4f9439}
.result.blue .result-name,.result.blue .percent{color:#3d86d8}
.result.purple .result-name,.result.purple .percent{color:#8a53d6}
.result.firefly .result-name,.result.firefly .percent{color:#dd9200}
.result-actions{position:absolute;left:16px;right:16px;bottom:18px;display:flex;gap:10px;z-index:4}
.result-actions .btn{height:48px;font-size:14px}
.ghost{background:rgba(255,255,255,.84);color:#7155bd;box-shadow:0 8px 18px rgba(77,61,140,.12)}
.toast{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);z-index:6;display:none;white-space:nowrap;padding:10px 14px;border-radius:999px;background:rgba(62,50,117,.86);color:white;font-size:13px}
.pop{animation:pop .32s ease}
@keyframes pop{40%{transform:scale(.94)}75%{transform:scale(1.02)}}
@media(min-width:520px){.app{width:430px;margin:auto}}
</style>
</head>
<body>
<div class="app">
  <section class="page start active" id="start">
    <img src="images/cover.jpg" class="cover-fit" alt="Angry Molly 封面">
    <div class="float-layer" id="startFloat"></div>
    <div class="start-panel">
      <div class="brand">POP MART · ANGRY MOLLY</div>
      <h1 class="start-title">活人感检测启动</h1>
      <p class="start-sub">系统怀疑你已进入 NPC 模式，<br>请完成 6 道 Molly 灵魂检测。</p>
      <button class="btn pulse" onclick="startQuiz()">开始测试</button>
    </div>
  </section>

  <section class="page quiz" id="quiz">
    <img src="images/cover.jpg" class="quiz-bg" alt="">
    <div class="quiz-wash"></div>
    <div class="float-layer" id="quizFloat"></div>
    <div class="molly-mini"><div class="face" id="face"><i></i></div></div>
    <div class="quiz-card" id="quizCard">
      <div class="topbar">
        <div class="progress"><i id="bar"></i></div>
        <div class="count" id="count">1/6</div>
      </div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
    </div>
  </section>

  <section class="page loading" id="loading">
    <div class="loader-fire"></div>
    <p>正在召唤你的 Molly 火焰...</p>
  </section>

  <section class="page result" id="result">
    <img class="poster-fit" id="resultPoster" src="" alt="测试结果">
    <div class="result-text">
      <h2 class="result-name" id="resultName"></h2>
      <div class="percent" id="percent"></div>
      <div class="copy" id="copy"></div>
    </div>
    <div class="toast" id="toast">可长按屏幕截图保存 / 分享</div>
    <div class="result-actions">
      <button class="btn ghost" onclick="restart()">重测一次</button>
      <button class="btn" onclick="showToast()">保存分享</button>
    </div>
  </section>
</div>

<script>
const questions = [
  {q:'微信里出现一句：“在吗？”\n你的第一反应是：', a:[['A','心率飙升',0],['B','假装没看见',1],['C','回一句“咋了”',2],['D','反手回一个“有事说事”',3]]},
  {q:'如果明天全世界停电停网一天：\n你会：', a:[['A','原地去世',0],['B','睡觉',1],['C','出门溜达',2],['D','兴奋得像刚越狱成功',3]]},
  {q:'当电梯里只有你和一个陌生人时\n你会：', a:[['A','盯着楼层数字研究人生',0],['B','假装刷手机',1],['C','偶尔看看镜子里的自己',2],['D','主动夸对方鞋子好看',3]]},
  {q:'如果甲方爸爸说：“这个方案再改改吧。”\n你觉得最可能的意思是：', a:[['A','我完了',0],['B','他到底要什么',1],['C','具体改哪里',2],['D','那你来做',3]]},
  {q:'看到落日时\n你会：', a:[['A','拍照发群',1],['B','说一句真好看',2],['C','停下来多看两眼',3],['D','突然觉得活着也不错',4]]},
  {q:'如果人生真的有“退出NPC模式”按钮：\n你会：', a:[['A','再等等',0],['B','看看别人怎么选',1],['C','试着按一下',3],['D','直接拍烂按钮然后冲出去',5]]}
];

const results = [
  {key:'firefly',name:'荧火 Molly',percent:'活人感浓度：60%',img:'images/firefly-light.png',copy:'有点累。<br>有点麻木。<br>但又不是真的放弃了'},
  {key:'purple',name:'紫火 Molly',percent:'活人感浓度：72%',img:'images/purple-fire.png',copy:'看起来很好说话，<br>其实记仇能力一流。'},
  {key:'blue',name:'蓝火 Molly',percent:'活人感浓度：82%',img:'images/blue-fire.png',copy:'人生没有标准答案，<br>你偏要自己写。<br>规矩很多，<br>但你不爱背课文。'},
  {key:'green',name:'绿火 Molly',percent:'活人感浓度：88%',img:'images/green-fire.png',copy:'以前总在照顾别人。<br>这一次，<br>你决定先照顾自己。'},
  {key:'love',name:'爱火 Molly',percent:'活人感浓度：95%',img:'images/love-fire.png',copy:'别人活着靠闹钟，<br>你活着靠心动。<br>别人集邮，<br>你收集心动。'},
  {key:'red',name:'赤火 Molly',percent:'活人感浓度：100%',img:'images/red-fire.png',copy:'别人劝你忍忍。<br>你选择问一句：<br><b>凭什么？</b>'}
];

let index = 0, score = 0;
const icons = ['heart','cloud','star','fire'];

function makeFloat(id){
  const layer = document.getElementById(id);
  if(!layer) return;
  const types = ['cloud','star','bubble'];
  for(let i=0;i<16;i++){
    const el = document.createElement('div');
    const t = types[i % types.length];
    el.className = t;
    if(t === 'star') el.innerHTML = '✦';
    el.style.left = Math.random()*100 + '%';
    el.style.top = (80 + Math.random()*25) + '%';
    el.style.animationDuration = (7 + Math.random()*8) + 's';
    el.style.animationDelay = (-Math.random()*8) + 's';
    if(t === 'cloud') el.style.transform = 'scale('+(0.55+Math.random()*0.55)+')';
    layer.appendChild(el);
  }
}
makeFloat('startFloat');
makeFloat('quizFloat');

setInterval(()=>{
  const f = document.getElementById('face');
  if(f){f.classList.add('blink');setTimeout(()=>f.classList.remove('blink'),160)}
},2600);

function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function startQuiz(){index=0;score=0;show('quiz');renderQuestion()}
function renderQuestion(){
  const item=questions[index];
  document.getElementById('bar').style.width=(index/questions.length*100)+'%';
  document.getElementById('count').innerText=(index+1)+'/'+questions.length;
  document.getElementById('question').innerText=item.q;
  const box=document.getElementById('options');box.innerHTML='';
  item.a.forEach((op,i)=>{
    const btn=document.createElement('button');
    btn.className='option';
    btn.innerHTML=`<div class="icon ${icons[i]}"></div><b>${op[0]}</b><span>${op[1]}</span>`;
    btn.onclick=()=>choose(op[2]);
    box.appendChild(btn);
  });
}
function choose(value){
  score += value;
  const card=document.getElementById('quizCard');
  card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');
  setTimeout(()=>{
    index++;
    if(index<questions.length){renderQuestion()}
    else{showLoading()}
  },240);
}
function showLoading(){
  show('loading');
  setTimeout(showResult,1200);
}
function showResult(){
  const level=Math.min(5,Math.floor(score/3));
  const r=results[level];
  const page=document.getElementById('result');
  page.className='page result '+r.key;
  document.getElementById('resultPoster').src=r.img;
  document.getElementById('resultName').innerText=r.name;
  document.getElementById('percent').innerText=r.percent;
  document.getElementById('copy').innerHTML=r.copy;
  show('result');
}
function restart(){startQuiz()}
function showToast(){
  const t=document.getElementById('toast');
  t.style.display='block';
  setTimeout(()=>t.style.display='none',1800);
}
</script>
</body>
</html>
